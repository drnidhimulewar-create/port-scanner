<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>Port Scanner</title>
            <link rel="stylesheet"
                  href="{{url_for('static',
                  filename='style.css')}}">
</head>
<body>
    <div class="container">
        <h1>\^ = ^/ Port Scanner \^ = ^/</h1>
        <form method="POST">
            <input type="text" name="target" placeholder="Enter IP Address or Hostname" required> 
          <button type="submit">
            Scan
          </button>
        </form>
        {% if target_ip %}
             <h2>Target: {{target_ip}}</h2>
        {% endif %}
        
        {% if ports %}
              <h3>Open Ports</h3>
              <ul>
                  {% for port in ports %}
                     <li>Port{{ port}} is  OPEN</li>
                  {% endfor %}   
              </ul>
        {% endif %}      
    </div>
</body>
</html>
